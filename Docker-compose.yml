version: '3.8'

services:
  app:
    image: bibisam06/pet-buddy:server
    container_name: petbuddy_app
    ports:
      - "3000:3000"
    env_file:
      - .env   # <- 환경 변수 파일로 관리
    depends_on:
      - redis
    networks:
      - petbuddy_network  

  redis:
    image: redis
    container_name: petbuddy_redis
    ports:
      - "6379:6379"
    networks:
      - petbuddy_network  

networks:
  petbuddy_network:
    driver: bridge
