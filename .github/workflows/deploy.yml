name: CI/CD

on:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Tag Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/petbuddy:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/petbuddy:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/petbuddy:server

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/petbuddy:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/petbuddy:server

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          script: |
            cd /home/ubuntu/

            # .env 및 docker-compose.yml 재생성
            echo "${{ secrets.ENV_VARS_PRODUCTION }}" | sudo tee .env.production > dev/null
            echo "${{ secrets.ENV_VARS_DEVELOPMENT }}" | sudo tee .env.development > dev/null
            echo "${{ secrets.ENV_VARS }}" | sudo tee .env > /dev/null
            echo "${{ secrets.DOCKER_COMPOSE }}" | sudo tee docker-compose.yml > /dev/null

            # 기존 이미지 제거 후 새 이미지 pull
            sudo docker rm -f $(sudo docker ps -aq) || true
            sudo docker rmi ${{ secrets.DOCKER_USERNAME }}/petbuddy:server || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/petbuddy:server

            # 재시작
            docker-compose -f docker-compose.yml --env-file .env up -d

            # 불필요한 이미지 정리
            docker image prune -a -f
